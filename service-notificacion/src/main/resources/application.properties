spring.application.name=service-notificacion
server.port=4430
#conexión a db correspondiente
spring.datasource.url=jdbc:mysql://localhost:3306/bd_notificaciones
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ruta de la documentación
springdoc.api-docs.path=/api/v1/notificaciones/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.cors.allowed-origins=http://localhost:4425
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS 
spring.mvc.cors.allowed-headers=*
#ordenar operaciones UI
springdoc.swagger-ui.operations-sorter=alpha
#dirige llamadas al gateway
springdoc.server-url=http://localhost:4425
