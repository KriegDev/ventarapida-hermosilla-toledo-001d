spring.application.name=service-cliente

spring.datasource.url=jdbc:mysql://localhost:3306/bd_cliente
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=4420

# Ruta donde se generará el JSON de la documentación
springdoc.api-docs.path=/api/v1/clientes/v3/api-docs

# Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración CORS para permitir peticiones desde el api-gateway
spring.mvc.cors.allowed-origins=http://localhost:4425
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*